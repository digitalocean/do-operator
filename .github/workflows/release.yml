name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag and release to create (e.g. v0.1.17)'
        required: true
permissions:
  contents: write
env:
  GITHUB_ENV: ".env"
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Install go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ^1.27
      - name: Check out code into the Go module directory
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Login to dockerhub to push the image
        run: echo "${{ secrets.DockerHubToken }}" | docker login --username "${DOCKER_USER}" --password-stdin
        env:
          DOCKER_USER: ${{ secrets.DockerHubUser }}
      - name: Build image, push, and generate release manifests
        run: make release
        env:
          IMG_TAG: ${{ github.event.inputs.tag }}
      - name: Commit release manifests
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4
        with:
          message: "create release manifests for ${{ github.event.inputs.tag }}"
          add: "releases/ config/manager/kustomization.yaml"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: find target commit to tag
        run: |
          sha="$(git rev-parse HEAD)"
          echo "TARGET_SHA=${sha}" >> "${GITHUB_ENV}"
      - name: Create Release
        id: create_release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commitish: ${{ env.TARGET_SHA }}
          tag_name: ${{ github.event.inputs.tag }}
          release_name: Release ${{ github.event.inputs.tag }}
